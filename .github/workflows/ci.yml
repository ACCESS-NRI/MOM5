name: Build
on:
  pull_request:
  push:
    branches:
      - master
      - access-esm1.5
jobs:
  pre-ci:
    name: Pre-CI
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Get PR manifests
        id: get-pr-manifests
        # Find all relevant files under .github/build-ci/manifests/pr
        # then quote the newline separated input via jq, so that each element can be slurped into a json array
        run: |
          files=$(find .github/build-ci/manifests/pr -type f -iname '*.j2' | jq --raw-input | jq --slurp --compact-output)
          echo "matrix=${files}" >> $GITHUB_OUTPUT

      - name: Get changed scheduled manifests
        id: get-scheduled-manifests-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: '.github/build-ci/manifests/scheduled/*.j2'
          matrix: true

      - name: Set up matrix
        id: set-matrix
        env:
          PR_MATRIX: ${{ steps.get-pr-manifests.outputs.matrix }}
          SCHEDULED_MATRIX: ${{ steps.get-scheduled-manifests-changed.outputs.all_changed_files }}
        run: |
          matrix=$(jq --compact-output --null-input \
            --argjson a "$PR_MATRIX" \
            --argjson b "${SCHEDULED_MATRIX:-[]}" \
            '$a + $b'
          )

          echo "$matrix"
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT

  ci:
    name: CI
    needs: pre-ci
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: ${{ fromJson(needs.pre-ci.outputs.matrix) }}
    uses: access-nri/build-ci/.github/workflows/ci.yml@v3
    with:
      spack-manifest-path: ${{ matrix.file }}
      spack-manifest-data-path: .github/build-ci/data/standard.json
      allow-ssh-into-spack-install: false  # If true, PR author must ssh into instance to complete job
      # Default args (including explicit spack/spack-packages/spack-config versions)
      # are specified in https://github.com/ACCESS-NRI/build-ci/tree/v3/.github/workflows#inputs
    secrets:
      spack-install-command-pat: ${{ secrets.SPACK_INSTALL_COMMAND_PAT }}
